<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a5298;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Card background -->
  <rect x="10" y="5" width="80" height="90" rx="8" fill="url(#cardGradient)"/>
  <rect x="15" y="10" width="70" height="80" rx="6" fill="white" stroke="#2a5298" stroke-width="2"/>
  
  <!-- Spade symbol -->
  <g transform="translate(50, 45)">
    <!-- Spade shape -->
    <path d="M 0,-15 C -8,-15 -12,-10 -12,-5 C -12,0 -8,3 -5,4 L -5,10 L 5,10 L 5,4 C 8,3 12,0 12,-5 C 12,-10 8,-15 0,-15 Z" 
          fill="#1e3c72"/>
    <!-- Stem -->
    <ellipse cx="0" cy="10" rx="5" ry="3" fill="#1e3c72"/>
  </g>
  
  <!-- Corner A -->
  <text x="25" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e3c72">A</text>
  <text x="25" y="45" font-family="Arial, sans-serif" font-size="16" fill="#1e3c72">♠</text>
</svg>